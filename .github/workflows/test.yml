name: Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    test:
        name: Test on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                go-version: ["1.21", "1.22"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-${{ matrix.go-version }}-

            - name: Download dependencies
              run: go mod download

            - name: Verify dependencies
              run: go mod verify

            - name: Run tests
              run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

            - name: Generate coverage report
              run: go tool cover -html=coverage.out -o coverage.html

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  file: ./coverage.out
                  flags: unittests
                  name: codecov-${{ matrix.os }}-go${{ matrix.go-version }}
                  fail_ci_if_error: false

            - name: Upload coverage artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.os }}-go${{ matrix.go-version }}
                  path: |
                      coverage.out
                      coverage.html

    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v4
              with:
                  version: latest
                  args: --timeout=5m

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [test, lint]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Build for multiple platforms
              run: |
                  # Windows
                  GOOS=windows GOARCH=amd64 go build -o bin/obelisk-windows-amd64.exe .

                  # Linux
                  GOOS=linux GOARCH=amd64 go build -o bin/obelisk-linux-amd64 .

                  # macOS Intel
                  GOOS=darwin GOARCH=amd64 go build -o bin/obelisk-darwin-amd64 .

                  # macOS Apple Silicon
                  GOOS=darwin GOARCH=arm64 go build -o bin/obelisk-darwin-arm64 .

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: binaries
                  path: bin/*

    integration-test:
        name: Integration Tests
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: binaries
                  path: bin/

            - name: Make binary executable
              run: chmod +x bin/obelisk-linux-amd64

            - name: Run integration tests
              run: |
                  # Test version command
                  ./bin/obelisk-linux-amd64 version

                  # Test help command
                  ./bin/obelisk-linux-amd64 --help

                  # Test config command
                  ./bin/obelisk-linux-amd64 config list || true

            - name: Test on sample project
              run: |
                  # Create a test project
                  mkdir -p test-project/src
                  echo "console.log('test');" > test-project/src/index.js
                  echo "node_modules/" > test-project/.gitignore

                  # Run scan (will fail without API key, but tests the flow)
                  ./bin/obelisk-linux-amd64 scan --path test-project --skip-ai || true

    security-scan:
        name: Security Scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Gosec Security Scanner
              uses: securego/gosec@master
              with:
                  args: "-no-fail -fmt sarif -out results.sarif ./..."

            - name: Upload SARIF file
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: results.sarif

