name: Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    test:
        name: Test on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                go-version: ["1.21", "1.22"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-${{ matrix.go-version }}-

            - name: Download dependencies
              run: go mod download

            - name: Verify dependencies
              run: go mod verify

            - name: Run tests
              run: go test -v ./...
              continue-on-error: true

            - name: Run tests with coverage (if tests exist)
              run: |
                  go test -coverprofile=coverage.out -covermode=atomic ./... || echo "No tests or tests failed"
              continue-on-error: true

            - name: Upload coverage to Codecov
              if: success() && matrix.os == 'ubuntu-latest' && matrix.go-version == '1.22'
              uses: codecov/codecov-action@v4
              with:
                  file: ./coverage.out
                  flags: unittests
                  name: codecov-${{ matrix.os }}-go${{ matrix.go-version }}
                  fail_ci_if_error: false
              continue-on-error: true

    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v4
              with:
                  version: latest
                  args: --timeout=5m
              continue-on-error: true

    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Build for multiple platforms
              run: |
                  # Windows
                  GOOS=windows GOARCH=amd64 go build -o bin/obelisk-windows-amd64.exe .

                  # Linux
                  GOOS=linux GOARCH=amd64 go build -o bin/obelisk-linux-amd64 .

                  # macOS Intel
                  GOOS=darwin GOARCH=amd64 go build -o bin/obelisk-darwin-amd64 .

                  # macOS Apple Silicon
                  GOOS=darwin GOARCH=arm64 go build -o bin/obelisk-darwin-arm64 .

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: binaries-${{ github.sha }}
                  path: bin/*

    integration-test:
        name: Integration Tests
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: binaries-${{ github.sha }}
                  path: bin/

            - name: Make binary executable
              run: chmod +x bin/obelisk-linux-amd64

            - name: Test version command
              run: ./bin/obelisk-linux-amd64 version || echo "Version command not available"
              continue-on-error: true

            - name: Test help command
              run: ./bin/obelisk-linux-amd64 --help || echo "Help command not available"
              continue-on-error: true

            - name: Test config command
              run: ./bin/obelisk-linux-amd64 config list || echo "Config command not available"
              continue-on-error: true

