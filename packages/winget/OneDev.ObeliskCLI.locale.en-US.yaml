ShortDescription: AI-Powered Automated Tech Lead for Modern Codebases
Description: |-
    Obelisk CLI is a high-performance command-line tool that acts as a final gatekeeper for your project.
    It evaluates project integrity, security, and architectural health using deep static analysis,
    native code parsing, and LLM intelligence powered by Google Gemini.

    Features:
    - Security Shield: Deep-scans for hardcoded secrets, API keys, and vulnerabilities
    - Code Quality: Native syntax checking, cyclomatic complexity analysis, technical debt tracking
    - AI Analysis: Health scores (A-F), vibe checks, and plain-English summaries
    - Multiple Modes: Interactive TUI, local dashboard, and headless CI/CD mode
    - Git Integration: Pre-push hooks to block commits with critical issues
    - Report Generation: Automatic markdown/text reports with timestamps

    Built with IBM Bob IDE for the IBM Bob Hackathon 2026.
